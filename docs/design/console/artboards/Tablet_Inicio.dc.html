<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  a { color: #7FE0C7; text-decoration: none; }
  a:hover { color: #9CEBD8; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
</helmet>
<div style="width:1280px;height:800px;position:relative;overflow:hidden;background:#0B0B0D;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#F2F2F4;box-sizing:border-box;">

  <div style="width:100%;height:100%;box-sizing:border-box;padding:28px 32px;display:flex;flex-direction:column;gap:28px;">

    <!-- Cabecalho: chip do PC atual em repouso (gatilho do seletor, painel fechado) + chip do PC fora do ar + botao de Ajustes -->
    <div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:row;align-items:center;gap:10px;">
        <div style="display:inline-flex;align-items:center;gap:10px;padding:10px 16px;background:#1C1C20;border:1px solid #7FE0C7;border-radius:10px;box-sizing:border-box;">
          <div style="width:8px;height:8px;border-radius:50%;background:#7FE0C7;flex-shrink:0;"></div>
          <span style="font-weight:700;font-size:16px;color:#F2F2F4;">ARTEMIS</span>
          <span style="font-weight:500;font-size:14px;color:#9A9AA5;">&middot; on-line</span>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-left:2px;">
            <path d="M5 8l5 5 5-5" stroke="#7FE0C7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>

        <!-- PC fora do ar: chip menor e esmaecido, so para sinalizar o estado sem reabrir o popover -->
        <div style="display:inline-flex;align-items:center;gap:8px;padding:8px 12px;opacity:0.55;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;">
          <div style="width:6px;height:6px;border-radius:50%;background:#5A5A62;flex-shrink:0;"></div>
          <span style="font-weight:600;font-size:13px;color:#9A9AA5;">NOTEBOOK</span>
          <span style="font-size:12px;color:#6A6A72;">&middot; fora do ar</span>
        </div>
      </div>

      <!-- Ajustes: retirado da fileira de capas, agora um botao visivel no canto do cabecalho (mesmo contorno de acento do foco, mas em repouso) -->
      <div style="height:44px;padding:0 18px;display:inline-flex;align-items:center;gap:10px;background:#1C1C20;border:1px solid #7FE0C7;border-radius:8px;box-sizing:border-box;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#F2F2F4;">
          <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></line>
          <circle cx="14" cy="6" r="2.25" stroke="currentColor" stroke-width="1.75"></circle>
          <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></line>
          <circle cx="9" cy="12" r="2.25" stroke="currentColor" stroke-width="1.75"></circle>
          <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></line>
          <circle cx="16" cy="18" r="2.25" stroke="currentColor" stroke-width="1.75"></circle>
        </svg>
        <span style="font-weight:700;font-size:16px;color:#F2F2F4;">Ajustes</span>
      </div>
    </div>

    <!-- Continuar -->
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:12px;font-weight:700;letter-spacing:0.08em;color:#9A9AA5;text-transform:uppercase;">Continuar</div>
      <div style="display:flex;flex-direction:row;align-items:stretch;gap:20px;background:#16161A;border:1px solid #2A2A30;border-radius:12px;padding:20px;width:600px;box-sizing:border-box;">
        <div style="width:160px;height:120px;flex-shrink:0;background:#101014;border:1px solid #2A2A30;border-radius:8px;box-sizing:border-box;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;">
          <div style="width:66%;height:46px;border:1px solid #34343C;border-radius:4px;align-self:flex-start;"></div>
          <div style="height:10px;width:100%;background:#1C1C22;border-radius:2px;display:flex;align-items:center;gap:4px;padding:0 4px;box-sizing:border-box;">
            <div style="width:4px;height:4px;border-radius:1px;background:#3C3C46;"></div>
            <div style="width:4px;height:4px;border-radius:1px;background:#3C3C46;"></div>
            <div style="width:4px;height:4px;border-radius:1px;background:#3C3C46;"></div>
          </div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;">
          <div style="font-weight:700;font-size:20px;color:#F2F2F4;">Área de trabalho</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:6px;height:6px;border-radius:50%;background:#7FE0C7;flex-shrink:0;"></div>
            <span style="font-weight:500;font-size:14px;color:#9A9AA5;">ARTEMIS &middot; em execução</span>
          </div>
          <div style="display:flex;flex-direction:row;gap:12px;margin-top:4px;">
            <div style="height:44px;padding:0 20px;background:#7FE0C7;border-radius:8px;display:flex;align-items:center;gap:8px;box-sizing:border-box;">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 3.5l10 6.5-10 6.5V3.5z" fill="#0A1F1A"></path>
              </svg>
              <span style="font-weight:700;font-size:14px;color:#0A1F1A;">Retomar</span>
            </div>
            <div style="height:44px;padding:0 18px;background:transparent;border:1px solid #3A3A40;border-radius:8px;display:flex;align-items:center;box-sizing:border-box;">
              <span style="font-weight:600;font-size:14px;color:#F2555B;">Encerrar no PC</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Apps -->
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:12px;font-weight:700;letter-spacing:0.08em;color:#9A9AA5;text-transform:uppercase;">Apps</div>

      <div style="width:1216px;overflow:hidden;box-sizing:border-box;">
        <div style="display:flex;flex-direction:row;align-items:flex-end;gap:20px;">

          <div style="width:160px;height:213px;flex-shrink:0;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:14px;display:flex;align-items:flex-end;">
            <span style="font-weight:700;font-size:16px;color:#F2F2F4;line-height:1.2;">Steam</span>
          </div>

          <div style="width:160px;height:213px;flex-shrink:0;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:14px;display:flex;align-items:flex-end;">
            <span style="font-weight:700;font-size:16px;color:#F2F2F4;line-height:1.2;">Corrida Noturna</span>
          </div>

          <!-- Foco de teclado: maior + contorno de acento -->
          <div style="width:190px;height:253px;flex-shrink:0;background:#22232A;border:3px solid #7FE0C7;border-radius:10px;box-sizing:border-box;padding:16px;display:flex;align-items:flex-end;box-shadow:0 0 0 4px rgba(127,224,199,0.15);">
            <span style="font-weight:700;font-size:18px;color:#F2F2F4;line-height:1.2;">Fortaleza</span>
          </div>

          <div style="width:160px;height:213px;flex-shrink:0;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:14px;display:flex;align-items:flex-end;">
            <span style="font-weight:700;font-size:16px;color:#F2F2F4;line-height:1.2;">Vale Silencioso</span>
          </div>

          <div style="width:160px;height:213px;flex-shrink:0;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:14px;display:flex;align-items:flex-end;">
            <span style="font-weight:700;font-size:16px;color:#F2F2F4;line-height:1.2;">Estrada Sem Fim</span>
          </div>

          <div style="width:160px;height:213px;flex-shrink:0;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:14px;display:flex;align-items:flex-end;">
            <span style="font-weight:700;font-size:16px;color:#F2F2F4;line-height:1.2;">Império de Ferro</span>
          </div>

        </div>
      </div>

      <!-- Info + acao do item focado -->
      <div style="display:flex;flex-direction:row;align-items:center;justify-content:space-between;margin-top:4px;">
        <span style="font-weight:700;font-size:20px;color:#F2F2F4;">Fortaleza</span>
        <div style="height:44px;padding:0 22px;background:#7FE0C7;border-radius:8px;display:flex;align-items:center;gap:8px;box-sizing:border-box;">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 3.5l10 6.5-10 6.5V3.5z" fill="#0A1F1A"></path>
          </svg>
          <span style="font-weight:700;font-size:14px;color:#0A1F1A;">Abrir</span>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
