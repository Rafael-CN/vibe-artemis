<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  a { color: #7FE0C7; text-decoration: none; }
  a:hover { color: #9CEBD8; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
</helmet>
<div style="width:412px;height:883px;position:relative;overflow:hidden;background:#0B0B0D;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#F2F2F4;box-sizing:border-box;">

  <div style="width:100%;height:100%;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;gap:16px;">

    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 4.5L6 10l6.5 5.5" stroke="#9A9AA5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span style="font-size:14px;font-weight:600;color:#9A9AA5;">Início</span>
      </div>
      <span style="font-size:28px;font-weight:800;color:#F2F2F4;">Ajustes</span>
      <span style="font-size:13px;color:#6A6A72;">ARTEMIS <span style="font-family:'JetBrains Mono',Consolas,monospace;">&middot; 192.168.0.10</span></span>
    </div>

    <div style="display:flex;flex-direction:column;background:#16161A;border:1px solid #2A2A30;border-radius:12px;overflow:hidden;box-sizing:border-box;">

      <!-- Resolucao -->
      <div style="padding:10px 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Resolução</span>
        <div style="display:flex;width:100%;border:1px solid #2A2A30;border-radius:8px;overflow:hidden;height:36px;box-sizing:border-box;">
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#9A9AA5;border-right:1px solid #2A2A30;">1080p</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0A1F1A;background:#7FE0C7;border-right:1px solid #2A2A30;">1440p</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#9A9AA5;">Nativa</div>
        </div>
      </div>

      <!-- Taxa -->
      <div style="padding:10px 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Taxa</span>
        <div style="display:flex;width:100%;border:1px solid #2A2A30;border-radius:8px;overflow:hidden;height:36px;box-sizing:border-box;">
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#9A9AA5;border-right:1px solid #2A2A30;">60 Hz</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#9A9AA5;border-right:1px solid #2A2A30;">90 Hz</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0A1F1A;background:#7FE0C7;">120 Hz</div>
        </div>
      </div>

      <!-- Taxa de bits -->
      <div style="padding:10px 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Taxa de bits</span>
          <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;color:#F2F2F4;">35 Mbps</span>
        </div>
        <div style="position:relative;width:100%;height:4px;border-radius:2px;background:#2A2A30;">
          <div style="position:absolute;left:0;top:0;width:58%;height:4px;border-radius:2px;background:#7FE0C7;"></div>
          <div style="position:absolute;left:58%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#7FE0C7;border:2px solid #16161A;"></div>
        </div>
      </div>

      <!-- Codec -->
      <div style="padding:10px 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Codec</span>
        <div style="display:flex;width:100%;border:1px solid #2A2A30;border-radius:8px;overflow:hidden;height:36px;box-sizing:border-box;">
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0A1F1A;background:#7FE0C7;border-right:1px solid #2A2A30;">Auto</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#9A9AA5;border-right:1px solid #2A2A30;">HEVC</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#9A9AA5;">AV1</div>
        </div>
      </div>

      <!-- HDR: desabilitado -->
      <div style="height:68px;padding:0 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span style="font-size:14px;font-weight:700;color:#6A6A72;">HDR</span>
          <span style="font-size:11px;color:#5A5A62;">Exige jogo com HDR e GPU compatível</span>
        </div>
        <div style="width:40px;height:22px;border-radius:11px;background:#202024;position:relative;box-sizing:border-box;opacity:0.7;flex-shrink:0;">
          <div style="position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#4A4A50;"></div>
        </div>
      </div>

      <!-- Audio -->
      <div style="height:56px;padding:0 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Áudio</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:13px;font-weight:600;color:#9A9AA5;">Estéreo</span>
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 5l6 5-6 5" stroke="#6A6A72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <!-- Modo do toque: item com foco -->
      <div style="padding:10px 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;background:#1C1C20;box-shadow:inset 0 0 0 2px #7FE0C7;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Modo do toque</span>
        <div style="display:flex;width:100%;border:1px solid #2A2A30;border-radius:8px;overflow:hidden;height:36px;box-sizing:border-box;">
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#9A9AA5;border-right:1px solid #2A2A30;">Touchpad</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0A1F1A;background:#7FE0C7;">Toque direto</div>
        </div>
      </div>

      <!-- Barra de texto -->
      <div style="height:56px;padding:0 16px;border-bottom:1px solid #2A2A30;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Barra de texto</span>
        <div style="width:40px;height:22px;border-radius:11px;background:#7FE0C7;position:relative;box-sizing:border-box;flex-shrink:0;">
          <div style="position:absolute;top:3px;left:21px;width:16px;height:16px;border-radius:50%;background:#0A1F1A;"></div>
        </div>
      </div>

      <!-- Controles na tela -->
      <div style="height:56px;padding:0 16px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Controles na tela</span>
        <div style="width:40px;height:22px;border-radius:11px;background:#7FE0C7;position:relative;box-sizing:border-box;flex-shrink:0;">
          <div style="position:absolute;top:3px;left:21px;width:16px;height:16px;border-radius:50%;background:#0A1F1A;"></div>
        </div>
      </div>

    </div>

    <!-- Avancado -->
    <div style="height:64px;padding:0 16px;background:#16161A;border:1px solid #2A2A30;border-radius:12px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:14px;font-weight:700;color:#F2F2F4;">Avançado</span>
        <span style="font-size:11px;color:#9A9AA5;">Mexa só sabendo por quê</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7.5 4.5l6 5.5-6 5.5" stroke="#9A9AA5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
