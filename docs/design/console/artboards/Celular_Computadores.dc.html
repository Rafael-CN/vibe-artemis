<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  a { color: #7FE0C7; text-decoration: none; }
  a:hover { color: #9CEBD8; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
</helmet>
<div style="width:412px;height:883px;position:relative;overflow:hidden;background:#0B0B0D;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#F2F2F4;box-sizing:border-box;">

  <div style="width:100%;height:100%;box-sizing:border-box;padding:28px 20px;display:flex;flex-direction:column;gap:24px;">

    <span style="font-size:28px;font-weight:800;color:#F2F2F4;">Computadores</span>

    <div style="display:flex;flex-direction:column;gap:16px;">

      <!-- ARTEMIS: on-line, foco de teclado/gamepad -->
      <div style="height:152px;padding:20px;background:#1C1C20;border-radius:12px;box-sizing:border-box;box-shadow:0 0 0 2px #7FE0C7;display:flex;flex-direction:column;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:8px;height:8px;border-radius:50%;background:#7FE0C7;flex-shrink:0;"></div>
          <span style="font-size:12px;font-weight:700;letter-spacing:0.06em;color:#7FE0C7;text-transform:uppercase;">On-line</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <span style="font-size:24px;font-weight:800;color:#F2F2F4;">ARTEMIS</span>
          <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;color:#9A9AA5;">192.168.0.10</span>
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.5 4.5l6 5.5-6 5.5" stroke="#7FE0C7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

      <!-- NOTEBOOK: fora do ar, desabilitado -->
      <div style="height:152px;padding:20px;background:#16161A;border:1px solid #2A2A30;border-radius:12px;box-sizing:border-box;opacity:0.55;display:flex;flex-direction:column;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:8px;height:8px;border-radius:50%;background:#5A5A62;flex-shrink:0;"></div>
          <span style="font-size:12px;font-weight:700;letter-spacing:0.06em;color:#6A6A72;text-transform:uppercase;">Fora do ar</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <span style="font-size:24px;font-weight:800;color:#9A9AA5;">NOTEBOOK</span>
          <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;color:#6A6A72;">endereço indisponível</span>
        </div>
      </div>

      <!-- Adicionar PC -->
      <div style="height:64px;border:1.5px dashed #3A3A40;border-radius:12px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 4v12M4 10h12" stroke="#7FE0C7" stroke-width="1.75" stroke-linecap="round"></path>
        </svg>
        <span style="font-weight:700;font-size:16px;color:#F2F2F4;">Adicionar PC</span>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
