<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  a { color: #7FE0C7; text-decoration: none; }
  a:hover { color: #9CEBD8; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
</helmet>
<div style="width:1280px;height:800px;position:relative;overflow:hidden;background:#101014;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#F2F2F4;box-sizing:border-box;">

  <!-- Video: Area de trabalho do PC, abstrata, sem marca -->
  <div style="position:absolute;left:340px;top:170px;width:600px;height:400px;background:#16161A;border:1px solid #2A2A30;border-radius:6px;box-sizing:border-box;">
    <div style="height:28px;background:#1C1C20;border-bottom:1px solid #2A2A30;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 10px;box-sizing:border-box;">
      <div style="width:6px;height:6px;border-radius:50%;background:#3A3A42;"></div>
      <div style="width:6px;height:6px;border-radius:50%;background:#3A3A42;"></div>
      <div style="width:6px;height:6px;border-radius:50%;background:#3A3A42;"></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:44px;background:#1A1A1E;border-top:1px solid #232328;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:20px;height:20px;border-radius:4px;background:#26262C;"></div>
      <div style="width:20px;height:20px;border-radius:4px;background:#26262C;"></div>
      <div style="width:20px;height:20px;border-radius:4px;background:#26262C;"></div>
    </div>
    <div style="width:60px;height:14px;border-radius:3px;background:#232328;"></div>
  </div>

  <!-- Menu da sessao: guia deslizada do topo, janela propria sobre o video -->
  <div style="position:absolute;left:0;top:0;right:0;height:104px;background:#16161A;border-bottom:1px solid #2A2A30;box-shadow:0 8px 20px rgba(0,0,0,0.45);display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box;z-index:10;">

    <div style="display:flex;flex-direction:row;gap:8px;align-items:stretch;">

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.75"></rect>
          <line x1="6" y1="10" x2="8" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
          <line x1="10" y1="10" x2="12" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
          <line x1="14" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
          <line x1="6" y1="14" x2="16" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Teclado</span>
      </div>

      <!-- Bloco focado por teclado/gamepad -->
      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 14px;box-sizing:border-box;background:#22232A;box-shadow:0 0 0 2px #7FE0C7 inset;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#7FE0C7;">
          <rect x="3" y="8" width="18" height="8" rx="2" stroke="currentColor" stroke-width="1.75"></rect>
          <line x1="6" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
          <line x1="15" y1="10.5" x2="15" y2="13.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></line>
        </svg>
        <span style="font-size:11px;font-weight:700;color:#F2F2F4;white-space:nowrap;">Barra de texto</span>
      </div>

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <path d="M6 4l11 11-4.2.6 2.4 4.9-2 1-2.4-4.9L8 19.5 6 4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"></path>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Modo do toque</span>
      </div>

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <rect x="5" y="5" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.75"></rect>
          <line x1="9" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Teclas especiais</span>
      </div>

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <rect x="8" y="3" width="8" height="14" rx="1.5" stroke="currentColor" stroke-width="1.75"></rect>
          <path d="M4 12a8 8 0 0013 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
          <path d="M4 9v3h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Girar a tela</span>
      </div>

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <line x1="5" y1="18" x2="5" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="12" y1="18" x2="12" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          <line x1="19" y1="18" x2="19" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Estatísticas</span>
      </div>

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 14px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.75"></rect>
          <rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"></rect>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Picture-in-picture</span>
      </div>

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <rect x="3" y="8" width="18" height="9" rx="4" stroke="currentColor" stroke-width="1.75"></rect>
          <line x1="7.5" y1="10.5" x2="7.5" y2="13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
          <line x1="6" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></line>
          <circle cx="16.5" cy="11" r="0.9" fill="currentColor"></circle>
          <circle cx="18" cy="12.5" r="0.9" fill="currentColor"></circle>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Controles na tela</span>
      </div>

    </div>

    <div style="display:flex;flex-direction:row;align-items:center;gap:16px;">
      <div style="width:1px;height:48px;background:#2A2A30;"></div>

      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 14px;box-sizing:border-box;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#C9C9CE;">
          <path d="M9 3v4M15 3v4M6 7h12v3a6 6 0 01-12 0V7z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" fill="none"></path>
          <line x1="12" y1="16" x2="12" y2="21" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></line>
        </svg>
        <span style="font-size:11px;font-weight:600;color:#C9C9CE;white-space:nowrap;">Desconectar</span>
      </div>

      <!-- Destrutivo: pede confirmacao -->
      <div style="min-width:96px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 14px;box-sizing:border-box;background:rgba(242,85,91,0.12);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:#F2555B;">
          <line x1="12" y1="4" x2="12" y2="11" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></line>
          <path d="M7.5 6.5a7 7 0 109 0" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" fill="none"></path>
        </svg>
        <span style="font-size:11px;font-weight:700;color:#F2555B;white-space:nowrap;">Encerrar no PC</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
