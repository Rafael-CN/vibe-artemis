<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  a { color: #7FE0C7; text-decoration: none; }
  a:hover { color: #9CEBD8; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
</helmet>
<div style="width:1280px;height:800px;position:relative;overflow:hidden;background:#101014;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#F2F2F4;box-sizing:border-box;">

  <!-- Video: Area de trabalho do PC, abstrata, sem marca -->
  <div style="position:absolute;left:340px;top:140px;width:600px;height:400px;background:#16161A;border:1px solid #2A2A30;border-radius:6px;box-sizing:border-box;">
    <div style="height:28px;background:#1C1C20;border-bottom:1px solid #2A2A30;border-radius:6px 6px 0 0;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 10px;box-sizing:border-box;">
      <div style="width:6px;height:6px;border-radius:50%;background:#3A3A42;"></div>
      <div style="width:6px;height:6px;border-radius:50%;background:#3A3A42;"></div>
      <div style="width:6px;height:6px;border-radius:50%;background:#3A3A42;"></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:180px;height:44px;background:#1A1A1E;border-top:1px solid #232328;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:20px;height:20px;border-radius:4px;background:#26262C;"></div>
      <div style="width:20px;height:20px;border-radius:4px;background:#26262C;"></div>
      <div style="width:20px;height:20px;border-radius:4px;background:#26262C;"></div>
    </div>
    <div style="width:60px;height:14px;border-radius:3px;background:#232328;"></div>
  </div>

  <!-- Gatilho do menu da sessao, em repouso: aba central na borda superior do video -->
  <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:64px;height:20px;background:#1C1C20;border:1px solid #2A2A30;border-top:none;border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;z-index:10;">
    <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 8l5 5 5-5" stroke="#6A6A72" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </div>

  <!-- Barra de texto: janela propria ancorada ao rodape -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#16161A;border-top:1px solid #2A2A30;box-shadow:0 -8px 20px rgba(0,0,0,0.4);padding:16px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;z-index:10;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:11px;font-weight:700;letter-spacing:0.08em;color:#9A9AA5;text-transform:uppercase;">Barra de texto</span>
      <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;color:#9A9AA5;font-variant-numeric:tabular-nums;">18 ms &middot; 35 Mbps</span>
    </div>

    <div style="display:flex;flex-direction:row;gap:12px;align-items:center;">
      <div style="flex:1;height:48px;background:#101014;border:1px solid #2A2A30;border-radius:8px;padding:0 16px;display:flex;align-items:center;gap:2px;box-sizing:border-box;">
        <span style="font-size:15px;color:#F2F2F4;">ipconfig /all</span>
        <div style="width:2px;height:18px;background:#7FE0C7;"></div>
      </div>
      <div style="height:48px;padding:0 24px;background:#7FE0C7;border-radius:8px;display:flex;align-items:center;gap:8px;box-sizing:border-box;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 10h11M11 5l5 5-5 5" stroke="#0A1F1A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        </svg>
        <span style="font-weight:700;font-size:14px;color:#0A1F1A;">Enviar</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:row;gap:10px;">
      <!-- pressionado -->
      <div style="height:40px;padding:0 16px;border:1px solid #7FE0C7;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#0B0B0D;box-shadow:inset 0 2px 4px rgba(0,0,0,0.6);box-sizing:border-box;">
        <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:500;color:#7FE0C7;">Esc</span>
      </div>
      <!-- foco de teclado -->
      <div style="height:40px;padding:0 16px;border:1px solid #2A2A30;border-radius:8px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;box-shadow:0 0 0 2px #7FE0C7;">
        <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:500;color:#F2F2F4;">Tab</span>
      </div>
      <div style="height:40px;padding:0 16px;border:1px solid #2A2A30;border-radius:8px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">
        <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:500;color:#C9C9CE;">Win</span>
      </div>
      <div style="height:40px;padding:0 16px;border:1px solid #2A2A30;border-radius:8px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">
        <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:500;color:#C9C9CE;">Alt+Tab</span>
      </div>
      <div style="height:40px;padding:0 16px;border:1px solid #2A2A30;border-radius:8px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">
        <span style="font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;font-weight:500;color:#C9C9CE;">Ctrl+Alt+Del</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
