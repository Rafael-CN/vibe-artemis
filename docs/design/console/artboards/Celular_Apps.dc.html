<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; }
  a { color: #7FE0C7; text-decoration: none; }
  a:hover { color: #9CEBD8; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
</helmet>
<div style="width:412px;height:883px;position:relative;overflow:hidden;background:#0B0B0D;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#F2F2F4;box-sizing:border-box;">

  <div style="width:100%;height:100%;box-sizing:border-box;padding:24px 20px;display:flex;flex-direction:column;gap:16px;">

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 4.5L6 10l6.5 5.5" stroke="#9A9AA5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <div style="width:6px;height:6px;border-radius:50%;background:#7FE0C7;flex-shrink:0;"></div>
        <span style="font-size:13px;font-weight:600;color:#9A9AA5;">ARTEMIS &middot; on-line</span>
      </div>
      <span style="font-size:28px;font-weight:800;color:#F2F2F4;">Apps</span>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;">

      <!-- Area de trabalho: em execucao -->
      <div style="aspect-ratio:3 / 4;background:#22232A;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:12px;display:flex;flex-direction:column;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:6px;height:6px;border-radius:50%;background:#7FE0C7;flex-shrink:0;"></div>
          <span style="font-size:11px;font-weight:700;letter-spacing:0.04em;color:#7FE0C7;text-transform:uppercase;">Em execução</span>
        </div>
        <span style="font-weight:700;font-size:15px;color:#F2F2F4;line-height:1.2;">Área de trabalho</span>
      </div>

      <div style="aspect-ratio:3 / 4;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:12px;display:flex;align-items:flex-end;">
        <span style="font-weight:700;font-size:15px;color:#F2F2F4;line-height:1.2;">Steam</span>
      </div>

      <div style="aspect-ratio:3 / 4;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:12px;display:flex;align-items:flex-end;">
        <span style="font-weight:700;font-size:15px;color:#F2F2F4;line-height:1.2;">Corrida Noturna</span>
      </div>

      <!-- Fortaleza: foco de teclado/gamepad -->
      <div style="aspect-ratio:3 / 4;background:#262730;border:3px solid #7FE0C7;border-radius:10px;box-sizing:border-box;padding:12px;display:flex;align-items:flex-end;transform:scale(1.06);position:relative;z-index:2;box-shadow:0 0 0 4px rgba(127,224,199,0.15);">
        <span style="font-weight:700;font-size:16px;color:#F2F2F4;line-height:1.2;">Fortaleza</span>
      </div>

      <div style="aspect-ratio:3 / 4;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:12px;display:flex;align-items:flex-end;">
        <span style="font-weight:700;font-size:15px;color:#F2F2F4;line-height:1.2;">Vale Silencioso</span>
      </div>

      <div style="aspect-ratio:3 / 4;background:#1C1C20;border:1px solid #2A2A30;border-radius:10px;box-sizing:border-box;padding:12px;display:flex;align-items:flex-end;">
        <span style="font-weight:700;font-size:15px;color:#F2F2F4;line-height:1.2;">Estrada Sem Fim</span>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
